- name: Deploy Promtail to Arch/Manjaro Hosts (Comprehensive)
  hosts: iron_nodes
  become: true
  vars:
    loki_url: "http://192.168.1.206:3100/loki/api/v1/push"
    promtail_version: "2.9.4"

  tasks:
    - name: Ensure unzip is installed (Pacman)
      shell: pacman -Sy --noconfirm unzip
      args:
        creates: /usr/bin/unzip

    - name: Download Promtail binary
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
        dest: "/tmp/promtail.zip"

    - name: Unarchive Promtail
      unarchive:
        src: "/tmp/promtail.zip"
        dest: "/usr/local/bin"
        remote_src: yes
        creates: "/usr/local/bin/promtail-linux-amd64"

    - name: Rename binary
      copy:
        src: "/usr/local/bin/promtail-linux-amd64"
        dest: "/usr/local/bin/promtail"
        mode: '0755'
        remote_src: yes

    - name: Create Promtail config directory
      file:
        path: /etc/promtail
        state: directory
        mode: '0755'

    - name: Generate Promtail config
      copy:
        dest: /etc/promtail/config.yml
        content: |
          server:
            http_listen_port: 9080
          positions:
            filename: /tmp/positions.yaml
          clients:
            - url: {{ loki_url }}
          scrape_configs:
            - job_name: system
              static_configs:
              - targets: [localhost]
                labels:
                  job: varlogs
                  host: {{ inventory_hostname }}
                  __path__: /var/log/*.log
            
            - job_name: journal
              journal:
                max_age: 12h
                labels:
                  job: systemd-journal
                  host: {{ inventory_hostname }}

            - job_name: libvirt
              static_configs:
              - targets: [localhost]
                labels:
                  job: qemu
                  host: {{ inventory_hostname }}
                  __path__: /var/log/libvirt/qemu/*.log

            - job_name: docker
              static_configs:
              - targets: [localhost]
                labels:
                  job: docker
                  host: {{ inventory_hostname }}
                  __path__: /var/lib/docker/containers/*/*.log

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/promtail.service
        content: |
          [Unit]
          Description=Promtail service for Homelab
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/promtail -config.file=/etc/promtail/config.yml
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target

    - name: Start and enable Promtail
      systemd:
        name: promtail
        state: restarted
        enabled: yes
        daemon_reload: yes
