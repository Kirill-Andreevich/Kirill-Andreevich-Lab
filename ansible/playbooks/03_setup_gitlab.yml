---
- name: Install Docker for GitLab and Registry Caches
  hosts: gitlab
  become: true
  tasks:
    - name: Install Docker
      apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: yes

    - name: Ensure Docker is started
      service:
        name: docker
        state: started
        enabled: yes

    - name: Создаем папки для данных GitLab и кэшей
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /srv/gitlab/config
        - /srv/gitlab/logs
        - /srv/gitlab/data
        - /srv/registry-ecr
        - /srv/registry-docker
        - /srv/registry-quay
        - /srv/registry-k8s
        - /srv/registry-ghcr

    - name: Создаем docker-compose.yml для GitLab и зеркал
      copy:
        dest: /srv/gitlab/docker-compose.yml
        content: |
          services:
            gitlab:
              image: 'gitlab/gitlab-ce:latest'
              restart: always
              hostname: 'gitlab-srv.lan'
              environment:
                GITLAB_OMNIBUS_CONFIG: |
                  external_url 'http://gitlab-srv.lan'
              ports:
                - '80:80'
                - '443:443'
                - '2222:22'
              volumes:
                - '/srv/gitlab/config:/etc/gitlab'
                - '/srv/gitlab/logs:/var/log/gitlab'
                - '/srv/gitlab/data:/var/opt/gitlab'
              shm_size: '256m'

            mirror-ecr:
              image: registry:2
              restart: always
              ports:
                - '5001:5000'
              environment:
                REGISTRY_PROXY_REMOTEURL: 'https://public.ecr.aws'
              volumes:
                - '/srv/registry-ecr:/var/lib/registry'

            mirror-docker:
              image: registry:2
              restart: always
              ports:
                - '5002:5000'
              environment:
                REGISTRY_PROXY_REMOTEURL: 'https://registry-1.docker.io'
              volumes:
                - '/srv/registry-docker:/var/lib/registry'

            mirror-quay:
              image: registry:2
              restart: always
              ports:
                - '5003:5000'
              environment:
                REGISTRY_PROXY_REMOTEURL: 'https://quay.io'
              volumes:
                - '/srv/registry-quay:/var/lib/registry'

            mirror-k8s:
              image: registry:2
              restart: always
              ports:
                - '5004:5000'
              environment:
                REGISTRY_PROXY_REMOTEURL: 'https://registry.k8s.io'
              volumes:
                - '/srv/registry-k8s:/var/lib/registry'

            registry-ghcr:
              image: registry:2
              restart: always
              ports:
                - "5005:5000"
              environment:
                REGISTRY_PROXY_REMOTEURL: "https://ghcr.io"
              volumes:
                - '/srv/registry-ghcr:/var/lib/registry'
	    	
    - name: Поднимаем GitLab и кэши
      shell: docker compose up -d
      args:
        chdir: /srv/gitlab
