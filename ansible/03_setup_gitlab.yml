---
- name: Install Docker for GitLab
  hosts: gitlab
  become: true
  tasks:
    - name: Install Docker
      apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: yes

    - name: Ensure Docker is started
      service:
        name: docker
        state: started
        enabled: yes

    - name: Создаем папки для данных GitLab
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /srv/gitlab/config
        - /srv/gitlab/logs
        - /srv/gitlab/data

    - name: Создаем docker-compose.yml для GitLab
      copy:
        dest: /srv/gitlab/docker-compose.yml
        content: |
          services:
            gitlab:
              image: 'gitlab/gitlab-ce:latest'
              restart: always
              hostname: '192.168.1.101'
              environment:
                GITLAB_OMNIBUS_CONFIG: |
                  external_url 'http://192.168.1.101'
              ports:
                - '80:80'
                - '443:443'
                - '2222:22'
              volumes:
                - '/srv/gitlab/config:/etc/gitlab'
                - '/srv/gitlab/logs:/var/log/gitlab'
                - '/srv/gitlab/data:/var/opt/gitlab'
              shm_size: '256m'

    - name: Поднимаем GitLab (Это займет время!)
      shell: docker compose up -d
      args:
        chdir: /srv/gitlab
