#cloud-config
package_update: true

# Разрешаем доступ по паролю
ssh_pwauth: true

users:
  - default
  - name: zabbix
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: false

chpasswd:
  list: |
    zabbix:P@ssw0rd!123
    root:P@ssw0rd!123
  expire: false

packages:
  - qemu-guest-agent
  - docker.io
  - docker-compose
  - curl
  - net-tools

write_files:
  - path: /opt/zabbix-stack/docker-compose.yml
    content: |
      version: '3.8'
      services:
        zabbix-db:
          image: postgres:15-alpine
          restart: always
          # Тюнинг Postgres: 250 коннектов и 6GB в ОЗУ
          command: >
            postgres
            -c shared_buffers=6GB
            -c max_connections=250
            -c work_mem=64MB
            -c maintenance_work_mem=1GB
            -c effective_cache_size=18GB
            -c checkpoint_completion_target=0.9
            -c wal_buffers=16MB
          volumes:
            - ./postgres_data:/var/lib/postgresql/data
          environment:
            - POSTGRES_PASSWORD=zabbix_strong_password
            - POSTGRES_USER=zabbix
            - POSTGRES_DB=zabbix

        zabbix-server:
          image: zabbix/zabbix-server-pgsql:6.4-ubuntu-latest
          restart: always
          ports:
            - "10051:10051"
          environment:
            - DB_SERVER_HOST=zabbix-db
            - POSTGRES_USER=zabbix
            - POSTGRES_PASSWORD=zabbix_strong_password
            - POSTGRES_DB=zabbix
            # Раскачанные воркеры под 250 коннектов базы
            - ZBX_STARTPOLLERS=100
            - ZBX_STARTTRAPPERS=20
            - ZBX_STARTDBSYNCERS=8
          depends_on:
            - zabbix-db

        zabbix-web:
          image: zabbix/zabbix-web-nginx-pgsql:6.4-ubuntu-latest
          restart: always
          ports:
            - "80:8080"
          environment:
            - ZBX_SERVER_HOST=zabbix-server
            - DB_SERVER_HOST=zabbix-db
            - POSTGRES_USER=zabbix
            - POSTGRES_PASSWORD=zabbix_strong_password
            - POSTGRES_DB=zabbix
            - PHP_TZ=Europe/Moscow
            # Тюнинг PHP, чтобы веб-морда не падала на отчетах
            - PHP_MAX_EXECUTION_TIME=600
            - PHP_MEMORY_LIMIT=512M
            - PHP_POST_MAX_SIZE=64M
            - PHP_UPLOAD_MAX_FILESIZE=64M
            - ZBX_X_FRAME_OPTIONS=""
          depends_on:
            - zabbix-server

        zabbix-agent:
          image: zabbix/zabbix-agent2:ubuntu-6.4-latest
          restart: always
          ports:
            - "10050:10050"
          environment:
            - ZBX_HOSTNAME=Zabbix server
            - ZBX_SERVER_HOST=zabbix-server
          privileged: true
          pid: "host"
          volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
          depends_on:
            - zabbix-server

runcmd:
  - systemctl enable --now docker
  - cd /opt/zabbix-stack && docker-compose up -d
