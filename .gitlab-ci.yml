stages:
  - infrastructure
  - kubernetes
  - platform
  - gitops

# Настройки для всех джобов
default:
  tags:
    - shell
  before_script:
    - echo ">>> Подготовка рабочего окружения..."
    - cp terraform/.terraformrc ~/.terraformrc || true
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - export KUBECONFIG=~/.kube/config

# ==========================================
# ЭТАП 1: Инфраструктура (Raw Terraform)
# ==========================================
deploy_infra:
  stage: infrastructure
  script:
    - echo ">>> Развертывание узлов K8s (Terraform)..."
    - cd terraform/cluster-nodes
    - terraform init
    - terraform apply -state=$HOME/k8s-cluster.tfstate -auto-approve
  # Сохраняем сгенерированный инвентарь для Ansible
  artifacts:
    paths:
      - ansible/inventory/generated_hosts.ini
    expire_in: 1 hour

# ==========================================
# ЭТАП 2: Кубернетес (Raw Ansible + kubectl)
# ==========================================
deploy_k8s:
  stage: kubernetes
  script:
    - echo ">>> Настройка ОС и Bootstrap Kubernetes..."
    - sleep 30
    - ansible-playbook -i ansible/inventory/generated_hosts.ini ansible/playbooks/01_prepare.yml
    - ansible-playbook -i ansible/inventory/generated_hosts.ini ansible/playbooks/02_install_k8s.yml
    - ansible-playbook -i ansible/inventory/generated_hosts.ini ansible/playbooks/02_init_master.yml
    - ansible-playbook -i ansible/inventory/generated_hosts.ini ansible/playbooks/02_join_workers.yml
    - ansible-playbook -i ansible/inventory/generated_hosts.ini ansible/playbooks/01_containerd_mirrors.yml
    
    - echo ">>> Ожидание готовности кластера..."
    - kubectl wait --for=condition=Ready nodes --all --timeout=120s
    
    - echo ">>> Настройка MetalLB (защита от Race Condition)..."
    - kubectl apply -f kubernetes/core/metallb-native.yaml
    - kubectl wait --namespace metallb-system --for=condition=ready pod -l component=controller --timeout=300s
    - kubectl wait --namespace metallb-system --for=condition=ready pod -l component=speaker --timeout=300s
    - sleep 15
    - kubectl apply -f kubernetes/core/metallb-config.yaml
  needs: ["deploy_infra"]

# ==========================================
# ЭТАП 3: Хранилище и Мониторинг (Raw Helm)
# ==========================================
deploy_platform:
  stage: platform
  script:
    - echo ">>> Установка зависимостей (SOPS) для расшифровки секретов..."
    - mkdir -p $HOME/.local/bin
    - export PATH=$PATH:$HOME/.local/bin
    - curl -fsSL -o $HOME/.local/bin/sops https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64
    - chmod +x $HOME/.local/bin/sops

    - echo ">>> Жесткая фиксация директорий Helm и переустановка плагина..."
    - export HELM_DATA_HOME=$HOME/.local/share/helm
    - export HELM_PLUGINS=$HELM_DATA_HOME/plugins
    - helm plugin uninstall secrets || true
    - helm plugin install https://github.com/jkroepke/helm-secrets --verify=false

    - echo ">>> Развертывание Democratic CSI (TrueNAS iSCSI)..."
    - helm secrets upgrade --install truenas-iscsi kubernetes/core/democratic-csi --namespace democratic-csi --create-namespace -f kubernetes/core/truenas-csi/zfs-iscsi-base.yaml -f kubernetes/core/truenas-csi/zfs-iscsi-prod.yaml -f kubernetes/core/truenas-csi/zfs-iscsi-secrets.yaml
    
    - echo ">>> Установка стека мониторинга (Prometheus + Grafana)..."
    - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    - helm repo add grafana https://grafana.github.io/helm-charts
    - helm repo update
    - helm secrets upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --namespace monitoring --create-namespace -f kubernetes/core/alertmanager-values-secrets.yaml -f kubernetes/core/grafana-dashboards.yaml --set grafana.service.type=LoadBalancer --set prometheus.service.type=LoadBalancer --set alertmanager.service.type=LoadBalancer --set kubeEtcd.enabled=false --set kubeControllerManager.enabled=false --set kubeScheduler.enabled=false --set kubeProxy.enabled=false
    
    - echo ">>> Установка стека логирования (Loki)..."
    - helm upgrade --install loki grafana/loki-stack --namespace monitoring -f kubernetes/core/loki-values.yaml
    
    - echo ">>> Применение кастомных правил и дашбордов..."
    - kubectl apply -f kubernetes/core/loki-datasource.yaml
    - kubectl apply -f kubernetes/core/baremetal-monitors.yaml
    - kubectl apply -f kubernetes/core/hedgehog-rules.yaml
    - kubectl apply -f kubernetes/core/network-alerts.yaml
  needs: ["deploy_k8s"]

# ==========================================
# ЭТАП 4: ArgoCD (GitOps)
# ==========================================
deploy_gitops:
  stage: gitops
  script:
    - echo ">>> Установка ArgoCD..."
    - kubectl create namespace argocd || true
    - kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml --server-side --force-conflicts
    - echo ">>> Фикс - замена образа Redis..."
    - kubectl set image deployment/argocd-redis redis=redis:7-alpine -n argocd
    - echo ">>> Ожидание запуска подов ArgoCD..."
    - kubectl wait --for=condition=Ready pods --all -n argocd --timeout=300s
    - echo ">>> Передача управления кластеру в ArgoCD..."
    - kubectl apply -f kubernetes/argocd-apps.yaml
  needs: ["deploy_platform"]
