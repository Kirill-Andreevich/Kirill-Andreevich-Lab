stages:
  - infrastructure
  - kubernetes
  - platform
  - gitops

# Глобальные настройки (выполняются перед каждым джобом)
default:
  tags:
    - shell
  before_script:
    - echo ">>> Подготовка рабочего окружения..."
    - cp terraform/.terraformrc ~/.terraformrc
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
    - export ANSIBLE_HOST_KEY_CHECKING=False
    # Достаем пароли из безопасных переменных GitLab
    - echo "$ANSIBLE_VAULT_PASSWORD" > ~/.vault_pass.txt
    - export ANSIBLE_VAULT_PASSWORD_FILE=~/.vault_pass.txt

# ==========================================
# ЭТАП 1: Инфраструктура (Terraform)
# Защищен lifecycle { prevent_destroy = true } для ВМ GitLab
# ==========================================
deploy_infra:
  stage: infrastructure
  script:
    - echo ">>> Развертывание KVM (Terraform)..."
    - cd terraform/infra-vms && terraform init && terraform apply -state=$HOME/cluster.tfstate -auto-approve
    - cd ../cluster-nodes && terraform init && terraform apply -state=$HOME/cluster.tfstate -auto-approve

# ==========================================
# ЭТАП 2: Кубернетес (Ansible + Healthchecks)
# Запустится ТОЛЬКО если deploy_infra успешен
# ==========================================
deploy_k8s:
  stage: kubernetes
  script:
    - echo ">>> Установка Kubernetes (Ansible + Flannel + MetalLB)..."
    - make k8s-base
  needs: ["deploy_infra"]

# ==========================================
# ЭТАП 3: Хранилище (TrueNAS) и Мониторинг (Helm)
# Запустится ТОЛЬКО если kubectl wait на ноды прошел успешно
# ==========================================
deploy_platform:
  stage: platform
  script:
    - echo ">>> Настройка TrueNAS CSI и стека Prometheus/Loki..."
    - make storage
    - make monitoring
  needs: ["deploy_k8s"]

# ==========================================
# ЭТАП 4: ArgoCD (GitOps)
# Запустится ТОЛЬКО если storage и monitoring развернуты
# ==========================================
deploy_gitops:
  stage: gitops
  script:
    - echo ">>> Установка ArgoCD и передача управления..."
    - make argocd
  needs: ["deploy_platform"]
