stages:
  - deploy-infrastructure

image: alpine:latest

before_script:
  # Устанавливаем необходимые пакеты
  - apk add --no-cache openssh-client ansible terraform make bash curl
  # Настраиваем SSH-ключ для доступа к гипервизорам
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

deploy-cluster:
  stage: deploy-infrastructure
  script:
    - echo ">>> Запуск Terraform (infra-vms)..."
    - cd terraform/infra-vms && terraform init && terraform apply -auto-approve
    - echo ">>> Запуск Terraform (cluster-nodes)..."
    - cd ../cluster-nodes && terraform init && terraform apply -auto-approve
    - cd ../../ansible
    - echo ">>> Настройка Kubernetes через Ansible..."
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - ansible-playbook -i inventory/generated_hosts.ini playbooks/01_prepare.yml
    - ansible-playbook -i inventory/generated_hosts.ini playbooks/02_install_k8s.yml
    - ansible-playbook -i inventory/generated_hosts.ini playbooks/02_init_master.yml
    - ansible-playbook -i inventory/generated_hosts.ini playbooks/02_join_workers.yml
  only:
    refs:
      - main
    changes:
      - terraform/**/*
      - ansible/**/*
