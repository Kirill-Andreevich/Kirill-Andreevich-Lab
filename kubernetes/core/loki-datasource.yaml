apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://192.168.1.206:3100 # Твой новый LoadBalancer IP
      version: 1
      editable: true
      jsonData:
        maxLines: 1000
